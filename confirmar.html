<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<title>Sobre o seu presente · Casa Nova</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Young+Serif&family=Nunito+Sans:opsz,wght@6..12,400;6..12,600;6..12,800&family=Caveat:wght@600&display=swap">
<link rel="stylesheet" href="style.css">
<style>
  body{display:grid;place-items:center;min-height:100vh;min-height:100dvh}
  .stage{width:100%;max-width:460px;display:grid;gap:22px;justify-items:center;text-align:center}
  .mini{margin:0;background:var(--surface);padding:10px 10px 34px;box-shadow:0 8px 24px rgba(43,36,32,.15);transform:rotate(-3deg);width:150px;position:relative}
  .mini img{aspect-ratio:4/5;width:100%;object-fit:cover}
  .mini figcaption{position:absolute;bottom:6px;left:0;right:0;font-family:var(--hand);font-size:1.1rem}
  .mini .tape{width:60px;height:20px;top:-9px}
  .hello{font-family:var(--display);font-weight:400;font-size:clamp(2rem,8vw,2.8rem);line-height:1.1;margin:0;text-wrap:balance}
  .sub{margin:0;color:var(--muted);font-size:1.05rem;line-height:1.55;max-width:36ch}
  .gift{width:100%;background:var(--surface);border:1px solid var(--line);border-radius:18px;display:grid;grid-template-columns:96px 1fr;gap:14px;align-items:center;padding:12px;text-align:left}
  .gift .pic{aspect-ratio:1;border-radius:12px;background:#fff;display:grid;place-items:center;font-family:var(--display);font-size:1.6rem;color:var(--accent);overflow:hidden}
  .gift .pic img{width:100%;height:100%;object-fit:contain;padding:8px}
  .gift div:last-child{min-width:0}
  .gift b{display:block;font-size:1.1rem}
  .gift small{color:var(--muted);font-size:.9rem;line-height:1.4;display:block;margin-top:2px}
  .choices{width:100%;display:grid;gap:10px}
  .choices .btn{width:100%;padding:14px 18px;font-size:1rem}
  .big{font-family:var(--hand);font-size:clamp(2.6rem,10vw,3.4rem);color:var(--accent);line-height:1;margin:0;transform:rotate(-2deg)}
  .back{color:var(--muted);font-weight:700;text-decoration:underline;text-underline-offset:3px}
  .sign{font-family:var(--hand);font-size:1.4rem;margin:0}
</style>
<script src="config.js"></script>
</head>
<body>
<main class="stage" id="stage" aria-live="polite">
  <p class="sub">Carregando…</p>
</main>
<script>
// Os botões só agem com clique: antivírus de email que abre o link não confirma nada sozinho.
const C = window.CONFIG;
const link = new URLSearchParams(location.search).get("t") || "";
const stage = document.getElementById("stage");
const headers = { apikey: C.supabaseAnonKey, "Content-Type": "application/json" };
if (C.supabaseAnonKey.startsWith("eyJ")) headers.Authorization = `Bearer ${C.supabaseAnonKey}`;
const rpc = async (fn, body) => {
  const r = await fetch(`${C.supabaseUrl}/rest/v1/rpc/${fn}`, { method: "POST", headers, body: JSON.stringify(body) });
  if (!r.ok) throw new Error();
  return r.json();
};
const el = (tag, cls, text) => { const e = document.createElement(tag); if (cls) e.className = cls; if (text != null) e.textContent = text; return e; };

function polaroid() {
  const f = el("figure", "mini");
  const img = el("img"); img.src = C.foto; img.alt = C.casal;
  f.append(el("div", "tape"), img, el("figcaption", null, C.legenda));
  return f;
}

function presente(r) {
  const item = C.itens.find(i => i.id === r.item_id) || { nome: r.item_nome || "Seu presente" };
  const g = el("div", "gift");
  const pic = el("div", "pic");
  if (item.foto) { const img = el("img"); img.src = item.foto; img.alt = item.nome; pic.append(img); }
  else pic.textContent = item.sigla || item.nome.slice(0, 2).toUpperCase();
  const txt = el("div"); txt.append(el("b", null, item.nome));
  if (item.frase) txt.append(el("small", null, item.frase));
  g.append(pic, txt);
  return g;
}

function final(grande, texto) {
  const voltar = el("a", "back", "Ver a lista de presentes"); voltar.href = "./";
  stage.replaceChildren(polaroid(), el("p", "big", grande), el("p", "sub", texto), el("p", "sign", C.casal), voltar);
}

async function responder(acao, btns) {
  btns.forEach(b => (b.disabled = true));
  try {
    const r = await rpc("responder_link", { p_link: link, p_acao: acao });
    if (r === "confirmado") final("Valeu demais!", "Tá confirmado e marcado certinho no site. Toda vez que a gente usar, vai lembrar de você.");
    else if (r === "liberado") final("Tudo certo!", "Liberamos o presente pra outra pessoa. Obrigado por avisar!");
    else final("Ué, sumiu", "Essa reserva não existe mais. Talvez já tenha sido liberada.");
  } catch { btns.forEach(b => (b.disabled = false)); final("Deu ruim aqui", "Não conseguimos registrar. Tenta de novo daqui a pouco."); }
}

(async () => {
  if (!link) return final("Opa!", "Esse link veio incompleto. Abre pelo botão do email que a gente mandou.");
  try {
    const [r] = await rpc("info_link", { p_link: link });
    if (!r) return final("Ué, sumiu", "Essa reserva não existe mais. Talvez já tenha sido liberada.");
    const primeiro = String(r.nome).split(" ")[0];
    if (r.status === "confirmado") return final(`Valeu, ${primeiro}!`, "Esse presente já está confirmado. Tá tudo certo por aqui.");
    const sim = el("button", "btn", "Já comprei!"); sim.type = "button";
    const nao = el("button", "btn ghost", "Desisti, pode liberar"); nao.type = "button";
    sim.onclick = () => responder("comprei", [sim, nao]);
    nao.onclick = () => responder("desisti", [sim, nao]);
    const choices = el("div", "choices"); choices.append(sim, nao);
    stage.replaceChildren(
      polaroid(),
      el("h1", "hello", `Oi, ${primeiro}!`),
      el("p", "sub", "A gente ficou muito feliz com a sua reserva. Só pra organizar a lista: já deu tempo de comprar?"),
      presente(r),
      choices
    );
  } catch { final("Deu ruim aqui", "Não conseguimos carregar. Tenta de novo daqui a pouco."); }
})();
</script>
</body>
</html>
