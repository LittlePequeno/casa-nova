<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<title>Confirmar presente · Casa Nova</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Young+Serif&family=Nunito+Sans:opsz,wght@6..12,400;6..12,600;6..12,800&family=Caveat:wght@600&display=swap">
<link rel="stylesheet" href="style.css">
<style>
  .box{max-width:520px;margin:8vh auto 0;background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:32px 28px;display:grid;gap:16px}
  .box h1{font-size:clamp(1.8rem,6vw,2.4rem);margin:0}
  .box p{margin:0;color:var(--muted);line-height:1.6}
  .item{font-family:var(--display);font-size:1.4rem;color:var(--ink)}
</style>
<script src="config.js"></script>
</head>
<body>
<div class="box" id="box">
  <div class="kicker">chá de casa nova</div>
  <p id="msg">Carregando…</p>
</div>
<script>
// Os botões só agem com clique: antivírus de email que abre o link não confirma nada sozinho.
const C = window.CONFIG;
const link = new URLSearchParams(location.search).get("t") || "";
const box = document.getElementById("box");
const headers = { apikey: C.supabaseAnonKey, "Content-Type": "application/json" };
if (C.supabaseAnonKey.startsWith("eyJ")) headers.Authorization = `Bearer ${C.supabaseAnonKey}`;
const rpc = async (fn, body) => {
  const r = await fetch(`${C.supabaseUrl}/rest/v1/rpc/${fn}`, { method: "POST", headers, body: JSON.stringify(body) });
  if (!r.ok) throw new Error();
  return r.json();
};
const el = (tag, cls, text) => { const e = document.createElement(tag); if (cls) e.className = cls; if (text != null) e.textContent = text; return e; };

function tela(titulo, texto, botoes = []) {
  box.replaceChildren(el("div", "kicker", "chá de casa nova"), el("h1", null, titulo));
  if (texto) box.append(texto instanceof Node ? texto : el("p", null, texto));
  if (botoes.length) { const a = el("div", "actions"); a.append(...botoes); box.append(a); }
  const voltar = el("a", "btn ghost", "Ir pra lista"); voltar.href = "./";
  box.append(voltar);
}

async function responder(acao, btn) {
  btn.disabled = true;
  try {
    const r = await rpc("responder_link", { p_link: link, p_acao: acao });
    if (r === "confirmado") tela("Valeu demais!", "Tá confirmado e marcado certinho no site. A gente vai lembrar de você toda vez que usar.");
    else if (r === "liberado") tela("Tudo certo!", "Liberamos o item pra outra pessoa. Obrigado por avisar!");
    else tela("Hmm, não achamos", "Essa reserva não existe mais. Talvez já tenha sido liberada.");
  } catch { btn.disabled = false; tela("Deu ruim aqui", "Não conseguimos registrar. Tenta de novo em alguns minutos."); }
}

(async () => {
  if (!link) return tela("Link incompleto", "Abre pelo botão do email que a gente mandou.");
  try {
    const [r] = await rpc("info_link", { p_link: link });
    if (!r) return tela("Hmm, não achamos", "Essa reserva não existe mais. Talvez já tenha sido liberada.");
    if (r.status === "confirmado") return tela(`Oi, ${r.nome}!`, "Esse presente já está confirmado. Obrigado!");
    const p = el("p"); p.append("Você reservou ", el("span", "item", r.item_nome || "um presente"), ". Já efetuou a compra?");
    const sim = el("button", "btn", "Já comprei"); sim.type = "button"; sim.onclick = () => responder("comprei", sim);
    const nao = el("button", "btn ghost", "Desisti, pode liberar"); nao.type = "button"; nao.onclick = () => responder("desisti", nao);
    tela(`Oi, ${r.nome}!`, p, [sim, nao]);
  } catch { tela("Deu ruim aqui", "Não conseguimos carregar. Tenta de novo em alguns minutos."); }
})();
</script>
</body>
</html>
